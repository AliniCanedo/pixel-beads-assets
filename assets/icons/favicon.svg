<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="PixelBeads Favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB6D9"/>
      <stop offset="100%" stop-color="#C4B5E0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  
  <!-- Pixel Bead Pattern -->
  <g transform="translate(12, 12)">
    <rect x="0" y="8" width="16" height="16" rx="4" fill="#FFFFFF"/>
    <rect x="8" y="0" width="16" height="16" rx="4" fill="#FFF4B0"/>
    <rect x="24" y="8" width="16" height="16" rx="4" fill="#B4E7F5"/>
    <rect x="12" y="20" width="16" height="16" rx="4" fill="#FF8EBE"/>
  </g>
</svg>
