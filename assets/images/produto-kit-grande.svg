<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="Kit Grande">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7E8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7C6B99" flood-opacity=".22"/>
    </filter>
    <pattern id="pixels" width="42" height="42" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" rx="3" fill="#ffffff" opacity=".25"/>
      <rect x="24" y="24" width="10" height="10" rx="2" fill="#ffffff" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" rx="34" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="34" fill="url(#pixels)"/>
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="740" height="440" rx="36" fill="#fff" opacity=".88"/>
  </g>
  <text x="450" y="250" text-anchor="middle" font-size="120">🌈</text>
  <text x="450" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="800" fill="#332A45">Kit Grande</text>
  <text x="450" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#8A66C9">Shopee</text>
  <g transform="translate(350 455)">
    <rect width="34" height="34" rx="8" fill="#FFB6D9"/>
    <rect x="46" width="34" height="34" rx="8" fill="#C4B5E0"/>
    <rect x="92" width="34" height="34" rx="8" fill="#A7D8F0"/>
    <rect x="138" width="34" height="34" rx="8" fill="#FFE7A8"/>
  </g>
</svg>