<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-label="SHEENGD1 LED Perler Beads Board Resistente ao Calor">
  <defs>
    <linearGradient id="sheengdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="heatResistGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF4500" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neonCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#FF4500" flood-opacity=".35"/>
    </filter>
    <pattern id="ledGridSheengd" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="4.2" fill="#00E5FF" opacity="0.75"/>
      <circle cx="12" cy="12" r="1.8" fill="#FFFFFF"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="32" fill="url(#sheengdBg)"/>

  <!-- Heat Resistance Ambient Radiance -->
  <circle cx="450" cy="250" r="240" fill="url(#heatResistGlow)"/>
  <circle cx="450" cy="250" r="180" fill="url(#neonCyan)"/>

  <!-- Main Board Body: Heat Resistant Casing -->
  <g filter="url(#boardShadow)">
    <rect x="220" y="70" width="460" height="340" rx="22" fill="#18182E" stroke="#FF5722" stroke-width="3.5"/>
  </g>

  <!-- Inner High-temp Pegboard Grid Area -->
  <rect x="240" y="90" width="420" height="300" rx="14" fill="#0D1117" stroke="#00E5FF" stroke-width="2"/>
  <rect x="240" y="90" width="420" height="300" rx="14" fill="url(#ledGridSheengd)"/>

  <!-- Pixel Mario Star / Pikachu Shape Glowing on Board -->
  <g transform="translate(450, 240)">
    <!-- Glowing Star pixels in LED lights -->
    <rect x="-12" y="-60" width="24" height="24" rx="4" fill="#FFE600"/>
    <rect x="-12" y="-36" width="24" height="24" rx="4" fill="#FFE600"/>
    <rect x="-36" y="-36" width="24" height="24" rx="4" fill="#FFB703"/>
    <rect x="12" y="-36" width="24" height="24" rx="4" fill="#FFB703"/>
    <rect x="-60" y="-12" width="24" height="24" rx="4" fill="#FF9E00"/>
    <rect x="-36" y="-12" width="24" height="24" rx="4" fill="#FFE600"/>
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#FFFFFF"/>
    <rect x="12" y="-12" width="24" height="24" rx="4" fill="#FFE600"/>
    <rect x="36" y="-12" width="24" height="24" rx="4" fill="#FF9E00"/>
    <rect x="-36" y="12" width="24" height="24" rx="4" fill="#FFE600"/>
    <rect x="-12" y="12" width="24" height="24" rx="4" fill="#FFE600"/>
    <rect x="12" y="12" width="24" height="24" rx="4" fill="#FFE600"/>
    <rect x="-48" y="36" width="24" height="24" rx="4" fill="#FF8500"/>
    <rect x="24" y="36" width="24" height="24" rx="4" fill="#FF8500"/>
  </g>

  <!-- Heat Shield Badge -->
  <g transform="translate(130, 95)">
    <rect width="135" height="42" rx="21" fill="#FF4500"/>
    <text x="67" y="27" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">♨️ ANTI-CALOR</text>
  </g>

  <!-- Discount Badge 64% OFF -->
  <g transform="translate(640, 95)">
    <rect width="125" height="42" rx="21" fill="#10B981"/>
    <text x="62" y="27" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">64% OFF</text>
  </g>

  <!-- Brand / Model Tag -->
  <g transform="translate(245, 102)">
    <rect width="115" height="28" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="57" y="19" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00E5FF">SHEENGD1 PRO</text>
  </g>

  <!-- Typography -->
  <text x="450" y="465" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-size="33" font-weight="800" fill="#FFFFFF">SHEENGD1 LED Perler Beads Board</text>
  <text x="450" y="505" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-size="20" font-weight="600" fill="#00F0FF">Controlada por App • Resistente ao Calor • Guiada por Luz</text>
  <text x="450" y="545" text-anchor="middle" font-family="'Outfit', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFD700">Somente R$ 93,09 na Shopee (64% OFF)</text>
</svg>
