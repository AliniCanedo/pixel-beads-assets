<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1440 600" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE1EF"/>
      <stop offset="40%" stop-color="#FFF5F9"/>
      <stop offset="100%" stop-color="#EBE3FF"/>
    </linearGradient>
    <pattern id="pixelGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <!-- Soft pixel circles/dots -->
      <circle cx="20" cy="20" r="1.5" fill="#C4B5E0" opacity="0.25"/>
    </pattern>
  </defs>
  <!-- Main Gradient -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#pixelGrid)"/>
  
  <!-- Subtle abstract pixel forms in the background -->
  <g opacity="0.35">
    <!-- Top left corner -->
    <rect x="-80" y="-80" width="240" height="240" rx="120" fill="#FFB6D9" filter="blur(80px)"/>
    <!-- Bottom right corner -->
    <rect x="1200" y="400" width="300" height="300" rx="150" fill="#C4B5E0" filter="blur(90px)"/>
    <!-- Center right glow -->
    <rect x="900" y="50" width="250" height="250" rx="125" fill="#B4E7F5" filter="blur(100px)"/>
  </g>
  
  <!-- Modern SVG shapes that evoke pixel art -->
  <g fill="#FFFFFF" opacity="0.15" transform="translate(100, 100)">
    <rect x="0" y="40" width="40" height="40" rx="8"/>
    <rect x="40" y="0" width="40" height="40" rx="8"/>
    <rect x="80" y="40" width="40" height="40" rx="8"/>
    <rect x="40" y="80" width="40" height="40" rx="8"/>
  </g>
  <g fill="#FFFFFF" opacity="0.15" transform="translate(1180, 200)">
    <rect x="0" y="40" width="40" height="40" rx="8"/>
    <rect x="40" y="0" width="40" height="40" rx="8"/>
    <rect x="80" y="40" width="40" height="40" rx="8"/>
    <rect x="40" y="80" width="40" height="40" rx="8"/>
  </g>
</svg>
